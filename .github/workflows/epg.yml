
name: Generate Combined beIN EPG (7 days)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bein-epg-update
  cancel-in-progress: false

jobs:
  grab_bein:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Install dependencies
        working-directory: epg
        run: |
          npm install --ignore-scripts
          npm run api:load
          npm install --no-save --ignore-scripts xml2js

      - name: Verify channel files
        working-directory: epg
        run: |
          test -f sites/beinsports.com/beinsports.com_mena-ar.channels.xml
          test -f sites/beinsports.com/beinsports.com_fr-fr.channels.xml

      - name: Grab beIN MENA AR EPG
        working-directory: epg
        run: |
          npm run grab -- \
            --channels=sites/beinsports.com/beinsports.com_mena-ar.channels.xml \
            --output=guide_bein_mena_ar.xml \
            --days=7

      - name: Check Arabic EPG output
        working-directory: epg
        run: |
          test -s guide_bein_mena_ar.xml

      - name: Grab beIN FR-FR EPG
        working-directory: epg
        run: |
          npm run grab -- \
            --channels=sites/beinsports.com/beinsports.com_fr-fr.channels.xml \
            --output=guide_bein_fr.xml \
            --days=7

      - name: Check French EPG output
        working-directory: epg
        run: |
          test -s guide_bein_fr.xml

      - name: Merge EPGs and add logos
        working-directory: epg
        run: |
          node <<'EOF'
          const fs = require('fs');
          const xml2js = require('xml2js');

          async function main() {
            const files = [
              'guide_bein_mena_ar.xml',
              'guide_bein_fr.xml'
            ];

            const logos = {
              '7836FEA9-6B39-4A1A-8352-DC5FCB97A16C':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS1.png',
              'beINSports2.qa@MENA':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS2.png',
              'beINSports4.qa@MENA':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS4.png',
              'beINSports5.qa@MENA':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS5.png',
              'beINSports6.qa@MENA':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS6.png',
              'beINSports7.qa@MENA':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS7.png',
              'beINSports8.qa@MENA':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS8.png',
              '5C08D9D3-C713-4F1F-947E-87C761428B9B':
                'https://github.com/ayoubboukous27/beIN-Sports-EPG-Worldwide/raw/refs/heads/main/Logos/BS9.png',
              'beINSports1.qa@France':
                'https://github.com/tv-logo/tv-logos/raw/refs/heads/main/countries/world-middle-east/bein-sports/bein-sports-1-french-mea.png',
              'beINSports2.qa@France':
                'https://github.com/tv-logo/tv-logos/raw/refs/heads/main/countries/world-middle-east/bein-sports/bein-sports-2-french-mea.png',
              'beINSports3.qa@France':
                'https://github.com/tv-logo/tv-logos/raw/refs/heads/main/countries/world-middle-east/bein-sports/bein-sports-3-french-mea.png'
            };

            const parser = new xml2js.Parser();
            const builder = new xml2js.Builder({
              headless: false,
              xmldec: {
                version: '1.0',
                encoding: 'UTF-8'
              }
            });

            const merged = {
              tv: {
                $: {},
                channel: [],
                programme: []
              }
            };

            const channelIds = new Set();

            for (const file of files) {
              if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
                throw new Error(`Missing or empty EPG file: ${file}`);
              }

              const result = await parser.parseStringPromise(
                fs.readFileSync(file, 'utf8')
              );

              if (!result.tv) {
                throw new Error(`Invalid XMLTV document: ${file}`);
              }

              for (const channel of result.tv.channel || []) {
                const id = channel.$?.id;
                if (!id) continue;

                if (logos[id]) {
                  channel.icon = [{ $: { src: logos[id] } }];
                }

                if (!channelIds.has(id)) {
                  channelIds.add(id);
                  merged.tv.channel.push(channel);
                }
              }

              merged.tv.programme.push(
                ...(result.tv.programme || [])
              );
            }

            if (!merged.tv.channel.length) {
              throw new Error('No channels found in merged EPG');
            }

            if (!merged.tv.programme.length) {
              throw new Error('No programmes found in merged EPG');
            }

            const output = builder.buildObject(merged);

            fs.writeFileSync(
              '../epg_mapped_with_logos.xml',
              output,
              'utf8'
            );

            console.log(`Channels: ${merged.tv.channel.length}`);
            console.log(`Programmes: ${merged.tv.programme.length}`);
            console.log('Combined EPG generated successfully');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Validate combined EPG
        run: |
          test -s epg_mapped_with_logos.xml

          node <<'EOF'
          const fs = require('fs');
          const xml2js = require('./epg/node_modules/xml2js');

          async function main() {
            const xml = fs.readFileSync(
              'epg_mapped_with_logos.xml',
              'utf8'
            );

            const result = await new xml2js.Parser()
              .parseStringPromise(xml);

            const channels = result.tv?.channel || [];
            const programmes = result.tv?.programme || [];

            if (!channels.length || !programmes.length) {
              throw new Error('Combined EPG is incomplete');
            }

            console.log(
              `Validation passed: ${channels.length} channels, ` +
              `${programmes.length} programmes`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg_mapped_with_logos.xml

          if git diff --cached --quiet; then
            echo "No EPG changes to commit"
            exit 0
          fi

          git commit -m "Update combined beIN EPG (MENA AR + FR-FR)"
          git push origin HEAD:main
          
